global_defs {
    router_id haproxy_lb02
    script_user root
    enable_script_security
}

vrrp_script chk_haproxy {
    script "/usr/local/bin/check_haproxy.sh"
    interval 2
    weight 2
}

vrrp_instance VI_1 {
    state BACKUP
    interface eth0               # Serveringizning tarmoq interfeysi nomi
    virtual_router_id 51
    priority 100                 # Backup uchun 100
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass SecretVRRPPass123
    }

    virtual_ipaddress {
        192.168.1.100/24 dev eth0
    }

    track_script {
        chk_haproxy
    }
}
