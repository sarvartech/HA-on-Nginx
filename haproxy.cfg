global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    user haproxy
    group haproxy
    daemon
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms
    errorfile 400 /etc/haproxy/errors/400.http
    errorfile 403 /etc/haproxy/errors/403.http
    errorfile 408 /etc/haproxy/errors/408.http
    errorfile 500 /etc/haproxy/errors/500.http
    errorfile 502 /etc/haproxy/errors/502.http
    errorfile 503 /etc/haproxy/errors/503.http
    errorfile 504 /etc/haproxy/errors/504.http

# HAProxy monitoring paneli (http://<IP>:8404/)
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats refresh 5s

# Asosiy kirish oqimi
frontend http_in
    bind 192.168.1.100:80
    mode http
    option forwardfor
    default_backend nginx_cluster

# Nginx backend serverlar
backend nginx_cluster
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200

    server nginx01 192.168.1.20:80 check fall 3 rise 2
    server nginx02 192.168.1.21:80 check fall 3 rise 2
